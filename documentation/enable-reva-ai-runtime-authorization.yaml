description: 'Attach the Reva AI Runtime Authorization policy.'

extended_description: |
  Attach the Reva AI Runtime Authorization policy.

  In this example the policy is global, so every model, tool and agent call
  through the AI Gateway is authorized against the Reva policy store. Attach it
  to an AI Model, AI Consumer or AI Consumer Group instead if you only want to
  govern part of your traffic.

  Calls are classified from the request body: OpenAI `messages`, MCP
  `tools/call`, or an A2A send-message request. Other payloads are proxied
  untouched.

  This policy also requires the following {{site.ai_gateway}} configuration:
  1. [Set up {{site.ai_gateway}}](/ai-gateway/get-started/) with an entity for
     each upstream you want governed: a model, an MCP server or an agent.
  1. Keep `request_buffering` enabled on the routes the policy covers — it reads
     the request body to classify the call. MCP endpoints stream over SSE and
     additionally need `response_buffering` disabled.
  1. Authenticate callers before their requests reach the policy, so that each
     one presents a user JWT.

title: 'Attach Reva AI Runtime Authorization'

weight: 900

requirements:
  - "You have an authorization token for Reva Trust Guardian, from the Reva console under **Settings → Connect to Reva Trust Guardian**."
  - "The Reva AI Runtime Authorization AI Custom Policy is [added](/plugins/reva-ai-runtime-authorization/#add-the-reva-ai-runtime-authorization-policy) to your {{site.ai_gateway}}, and every data plane can run it."

variables:
  reva-host:
    value: $REVA_HOST
    description: |
      Reva host, for example `api.example.reva.ai`. Defaults to `api.reva.ai`
      when omitted.
  auth-token:
    value: $REVA_AUTH_TOKEN
    description: |
      Token {{site.ai_gateway}} presents to the Reva Trust Guardian.
      Use a [vault reference](/gateway/entities/vault/) in production rather than
      a literal — the field is referenceable.

config:
  reva_host: ${reva-host}
  auth_token: ${auth-token}
  fail_open: false

tools:
  - konnect-api
  - kongctl
  - terraform

min_version:
  ai-gateway: '2.2'
